name: Auto Pluto Update

on:
  schedule:
    - cron: '7 * * * *'   # hourly, off the :00 mark (less queue delay)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pluto-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node index.js

      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto update playlist" || echo "No changes"
          git push

      - name: Keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable auto.yml -R ${{ github.repository }}
